version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: uzze-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-uzze}
      MYSQL_USER: ${DB_USER:-uzze_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uzze_password}
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
